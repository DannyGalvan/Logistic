name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      # BD propia del workflow: nunca se usan las credenciales del servidor real.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
          POSTGRES_DB: stockflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DATABASE_URL: postgres://stockflow:stockflow@localhost:5432/stockflow
      TEST_DATABASE_ENGINE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt
      - name: Django check
        run: python manage.py check
      - name: Migraciones al dia
        run: python manage.py makemigrations --check --dry-run
      - name: Pylint
        run: |
          mkdir -p reports
          pylint apps config tests --fail-under=9.5
          pylint apps config --output-format=json2 > reports/pylint.json || true
      - name: Tests y cobertura
        run: pytest --cov --cov-report=term-missing --cov-report=html
      - name: Artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            htmlcov/
            reports/pylint.json
