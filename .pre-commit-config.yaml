repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-toml
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        language: system
        entry: .venv/bin/python -m pylint
        args: ["apps", "config", "tests"]
        types: [python]
        exclude: |
            (?x)^(
                .*/migrations/.*|
                apps/quality/snippets/.*
            )$