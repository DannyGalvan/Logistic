<div class="row g-2">
  <div class="col-6 col-md-4 col-xl-2"><div class="border rounded-3 p-2 text-center"><div class="small text-body-secondary">Convencion (C)</div><div class="fw-semibold">{{ run.convention_count }}</div></div></div>
  <div class="col-6 col-md-4 col-xl-2"><div class="border rounded-3 p-2 text-center"><div class="small text-body-secondary">Refactor (R)</div><div class="fw-semibold">{{ run.refactor_count }}</div></div></div>
  <div class="col-6 col-md-4 col-xl-2"><div class="border rounded-3 p-2 text-center"><div class="small text-body-secondary">Advertencia (W)</div><div class="fw-semibold">{{ run.warning_count }}</div></div></div>
  <div class="col-6 col-md-4 col-xl-2"><div class="border rounded-3 p-2 text-center"><div class="small text-body-secondary">Error (E)</div><div class="fw-semibold">{{ run.error_count }}</div></div></div>
  <div class="col-6 col-md-4 col-xl-2"><div class="border rounded-3 p-2 text-center"><div class="small text-body-secondary">Fatal (F)</div><div class="fw-semibold">{{ run.fatal_count }}</div></div></div>
  <div class="col-6 col-md-4 col-xl-2"><div class="border rounded-3 p-2 text-center"><div class="small text-body-secondary">Info (I)</div><div class="fw-semibold">{{ run.info_count }}</div></div></div>
</div>
