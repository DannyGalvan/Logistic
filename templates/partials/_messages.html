{% if messages %}
  <div class="toast-container position-fixed top-0 end-0 p-3">
    {% for message in messages %}
      <div class="toast align-items-center border-0 show sf-toast sf-toast-{{ message.tags|default:'info' }}"
           role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
        <div class="d-flex">
          <div class="toast-body d-flex align-items-center gap-2">
            {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill"></i>
            {% elif message.tags == 'error' or message.tags == 'danger' %}<i class="bi bi-x-circle-fill"></i>
            {% elif message.tags == 'warning' %}<i class="bi bi-exclamation-triangle-fill"></i>
            {% else %}<i class="bi bi-info-circle-fill"></i>{% endif %}
            {{ message }}
          </div>
          <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
      </div>
    {% endfor %}
  </div>
{% endif %}
