<div class="empty-state">
  <div class="empty-icon"><i class="bi {{ icon|default:'bi-inbox' }}"></i></div>
  <p class="fw-semibold mb-1">{{ message|default:'Sin registros para mostrar.' }}</p>
  {% if cta_url %}
    <p class="text-body-secondary small mb-3">Crea el primero para empezar.</p>
    <a href="{{ cta_url }}" class="btn btn-sm btn-primary"><i class="bi bi-plus-lg me-1"></i>{{ cta_label }}</a>
  {% endif %}
</div>
