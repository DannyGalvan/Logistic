<header class="app-topbar">
  <button class="btn btn-icon d-lg-none" type="button" data-bs-toggle="offcanvas"
          data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-label="Abrir menu">
    <i class="bi bi-list fs-4"></i>
  </button>
  <div class="topbar-title text-truncate">{% block topbar_title %}{% endblock %}</div>
  <div class="ms-auto d-flex align-items-center gap-2">
    <button class="btn btn-icon" type="button" id="themeToggle" aria-label="Cambiar tema">
      <i class="bi bi-moon-stars theme-icon-dark"></i>
      <i class="bi bi-sun theme-icon-light"></i>
    </button>
    {% if user.is_authenticated %}
      <a class="btn btn-icon position-relative" href="{% url 'inventory:alert-list' %}" aria-label="Alertas">
        <i class="bi bi-bell"></i>
        {% if alerts_count %}
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">{{ alerts_count }}</span>
        {% endif %}
      </a>
      <div class="dropdown">
        <button class="btn user-menu d-flex align-items-center gap-2" data-bs-toggle="dropdown"
                type="button" aria-expanded="false">
          <span class="avatar avatar-sm">{{ user.get_username|slice:":1"|upper }}</span>
          <span class="d-none d-sm-inline fw-medium">{{ user.get_username }}</span>
          <i class="bi bi-chevron-down small text-body-secondary"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow border-0">
          <li><a class="dropdown-item" href="{% url 'accounts:profile' %}"><i class="bi bi-person me-2"></i>Mi perfil</a></li>
          {% if user.is_staff %}
            <li><a class="dropdown-item" href="{% url 'admin:index' %}"><i class="bi bi-shield-lock me-2"></i>Administracion Django</a></li>
          {% endif %}
          <li><hr class="dropdown-divider"></li>
          <li>
            <form method="post" action="{% url 'accounts:logout' %}">
              {% csrf_token %}
              <button class="dropdown-item text-danger" type="submit"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesion</button>
            </form>
          </li>
        </ul>
      </div>
    {% endif %}
  </div>
</header>
