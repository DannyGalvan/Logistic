{% load ui %}
<nav id="sidebarMenu"
     class="col-md-3 col-lg-2 d-md-block bg-body border-end sidebar collapse">
  <div class="position-sticky pt-3">
    {% for group in menu_groups %}
      <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-2 mb-1 text-uppercase text-secondary">
        <span>{{ group.section }}</span>
      </h6>
      <ul class="nav flex-column">
        {% for item in group.items %}
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center gap-2"
               href="{% url item.url_name %}">
              <i class="bi {{ item.icon }}"></i>
              <span>{{ item.label }}</span>
            </a>
          </li>
        {% endfor %}
      </ul>
    {% empty %}
      <p class="text-secondary small px-3 mt-3 mb-0">Sin entradas de menu.</p>
    {% endfor %}
  </div>
</nav>
