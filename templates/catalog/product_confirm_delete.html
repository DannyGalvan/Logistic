{% extends 'base.html' %}
{% block title %}Desactivar producto{% endblock %}
{% block content %}
<div class="form-card" style="max-width: 560px">
  <a href="{% url 'catalog:product-list' %}" class="page-back"><i class="bi bi-arrow-left"></i> Volver</a>
  <form method="post" class="card">
    {% csrf_token %}
    <div class="card-body p-4 text-center">
      <div class="empty-icon tone-rose mb-3"><i class="bi bi-slash-circle"></i></div>
      <h1 class="h4 fw-semibold">Desactivar producto</h1>
      <p class="text-body-secondary mb-0">Se desactivara <span class="cell-code">{{ object.sku }}</span> <strong>{{ object.name }}</strong>.
        Ya no aparecera en altas ni movimientos, pero su historial se conserva.</p>
    </div>
    <div class="card-footer d-flex gap-2 justify-content-end">
      <a href="{% url 'catalog:product-list' %}" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-danger">Desactivar</button>
    </div>
  </form>
</div>
{% endblock %}
