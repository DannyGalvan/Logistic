{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ object|default:'Nuevo usuario' }}{% endblock %}
{% block content %}
<h1 class="h3 mb-4">
  {% if object %}Editar usuario{% else %}Nuevo usuario{% endif %}
</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {% crispy form %}
  <div class="d-flex gap-2 justify-content-end">
    <a href="{% url 'accounts:user-list' %}" class="btn btn-outline-secondary">Cancelar</a>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </div>
</form>
{% endblock %}
